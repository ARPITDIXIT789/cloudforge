---
# ============================================================================
# CloudForge - Security Hardening Role Handlers
# ============================================================================

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
    enabled: true

- name: Restart auditd
  ansible.builtin.command: service auditd restart
  failed_when: false
  changed_when: true

- name: Reload ufw
  community.general.ufw:
    state: enabled
  when: ansible_os_family == "Debian"
