###############################################################################
# CloudForge CI — DevSecOps Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Stages: Lint → Test → Trivy CVE Scan → Build & Push ECR → GitOps Update
# Trigger: push to main/develop (app/** or Dockerfile) and PRs to main
###############################################################################
name: "CloudForge CI — Build, Scan & Deploy"

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudforge-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: write
  id-token: write

# ─── Concurrency: cancel in-flight runs on the same branch ──────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Stage 1 — Lint & Unit Tests                                            ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝
  lint-and-test:
    name: "🧪 Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flake8 pytest pytest-cov || true

      - name: Run linting
        run: flake8 app/ --max-line-length=120 --ignore=E501 || true

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Stage 2 — Trivy Container CVE Scan                                     ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝
  security-scan:
    name: "🔒 Trivy Container CVE Scan"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Install Trivy Security Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Run Trivy Vulnerability Scan (Console Report & Gate)
        run: |
          echo "=========================================================================="
          echo " TRIVY VULNERABILITY SCAN: FULL CONTAINER IMAGE CVE AUDIT "
          echo "=========================================================================="
          trivy image --severity CRITICAL,HIGH --exit-code 0 ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          echo ""
          echo ">> Enforcing DevSecOps Quality Gate: checking actionable CRITICAL CVEs..."
          trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Stage 3 — Build & Push to Amazon ECR                                   ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝
  build-and-push:
    name: "🐳 Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: security-scan
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942893240217:role/cloudforge-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Install Trivy for SBOM
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM with Trivy
        run: |
          trivy image --format cyclonedx --output sbom.json $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Stage 4 — Update GitOps Manifest (main only)                           ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝
  update-gitops:
    name: "🔄 Update GitOps Manifest"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tag
        run: |
          cd gitops/apps/sample-microservice
          sed -i "s|tag:.*|tag: \"${{ env.IMAGE_TAG }}\"|" values.yaml

      - name: Commit and push updated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/sample-microservice/values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(gitops): update image tag to ${{ env.IMAGE_TAG }}"
          git push
