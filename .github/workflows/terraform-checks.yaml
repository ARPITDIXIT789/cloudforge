###############################################################################
# CloudForge Terraform — Lint, Security & Validate
# ─────────────────────────────────────────────────────────────────────────────
# Quality gates: fmt → init → validate → TFLint → tfsec
# Trigger: push/PR on terraform/** paths
###############################################################################
name: "CloudForge Terraform — Lint, Security & Validate"

on:
  push:
    branches: [main, develop]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']

# ─── Concurrency: cancel in-flight runs on the same branch ──────────────────
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Terraform Quality Gates                                                ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝
  terraform-checks:
    name: "🏗️ Terraform Quality Gates"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # ── Format ──────────────────────────────────────────────────────────────
      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      # ── Init & Validate ────────────────────────────────────────────────────
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # ── TFLint ──────────────────────────────────────────────────────────────
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive ../../

      # ── tfsec Security Scanner ─────────────────────────────────────────────
      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: false

      # ── Cost Estimation (PR only) ──────────────────────────────────────────
      - name: Setup Infracost
        if: github.event_name == 'pull_request'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        if: github.event_name == 'pull_request'
        run: |
          infracost breakdown --path=../../ \
            --format=json \
            --out-file=/tmp/infracost.json
        continue-on-error: true

      - name: Post Infracost PR comment
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update
        continue-on-error: true
