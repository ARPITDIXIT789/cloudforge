###############################################################################
# CloudForge — Sample Microservice Default Values
###############################################################################

## -- Number of pod replicas (ignored when autoscaling.enabled is true)
replicaCount: 2

## -- Container image configuration
image:
  repository: "942893240217.dkr.ecr.ap-south-1.amazonaws.com/cloudforge-app"
  tag: "latest"
  pullPolicy: IfNotPresent

## -- Optional image pull secrets for private registries
imagePullSecrets: []

## -- Override the chart name / fullname
nameOverride: ""
fullnameOverride: ""

## -- Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

## -- Pod-level annotations (e.g. Prometheus scrape, Datadog)
podAnnotations: {}

## -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

## -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
      - ALL

## -- Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  protocol: TCP

## -- Ingress (AWS ALB) configuration
ingress:
  enabled: true
  host: "api.example.com"
  tls:
    enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:123456789012:certificate/xxxxx"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: cloudforge

## -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 256Mi

## -- Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

## -- Health check configuration
healthcheck:
  path: /healthz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

## -- Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

## -- Node selector
nodeSelector: {}

## -- Tolerations
tolerations: []

## -- Pod anti-affinity for HA
affinity: {}

## -- Graceful shutdown
terminationGracePeriodSeconds: 30

## -- Additional environment variables (name/value pairs)
env: []
  # - name: LOG_LEVEL
  #   value: "info"

## -- Environment variables from ConfigMap references
envFromConfigMaps: []
  # - configmap-name

## -- Environment variables from Secret references
envFromSecrets: []
  # - secret-name

## -- Argo Rollouts canary configuration
canary:
  enabled: true
  steps:
    - setWeight: 10
    - pause: {duration: 60}
    - setWeight: 30
    - pause: {duration: 60}
    - setWeight: 60
    - pause: {duration: 60}
  analysis:
    enabled: true
    interval: 30s
    threshold: 3
    maxWeight: 60
    errorRateThreshold: 1
    prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
