###############################################################################
# CloudForge — ServiceMonitor for Prometheus Scrapes (Static Manifest)
###############################################################################
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-microservice
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-microservice
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
